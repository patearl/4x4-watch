name: Build debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew assembleDebug testDebugUnitTest

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk 4x4-watch-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: 4x4-watch-debug
          path: 4x4-watch-debug.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Build ${{ github.run_number }} (${{ github.ref_name }})
          body: |
            Debug APK built from ${{ github.sha }} on `${{ github.ref_name }}`.

            Install: `adb install -r 4x4-watch-debug.apk`
          files: 4x4-watch-debug.apk
          # Only builds from main become "latest"; other branches are pre-releases.
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          make_latest: ${{ github.ref == 'refs/heads/main' }}
